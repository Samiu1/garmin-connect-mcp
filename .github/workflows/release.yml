name: Release

# Publishes to npm when a v* tag is pushed. Publishing from CI rather than a
# laptop is what produces npm provenance: the id-token permission below lets the
# runner prove to npm which repository and commit built the tarball.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for --provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # A tag that disagrees with package.json would publish a version nobody
      # can trace back to a commit, so stop before the registry call.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "tag and package.json agree on $PKG"

      - run: npm run build

      # The offline self-check: tool manifest, argument validation, path safety,
      # and the key-command failure modes. It needs no credentials.
      - run: npm run smoke

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
